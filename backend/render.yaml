services:
  - type: web
    name: skillbridge-api
    runtime: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: python -m pip install --upgrade pip setuptools wheel && python -m pip install -r requirements.txt
    startCommand: python start.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: EMBEDDING_DIMENSIONS
        value: "384"
      - key: SIMILARITY_THRESHOLD
        value: "0.62"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.11"
